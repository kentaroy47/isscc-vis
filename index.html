<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISSCC 2027 採択統計</title>
<meta name="description" content="ISSCC 2027 accepted paper statistics by affiliation, country and author / ISSCC 2027 採択論文の所属・国・著者別統計">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1 data-i18n="title">ISSCC 2027 採択統計</h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="head-btns">
      <button class="theme-btn" id="langBtn" type="button" lang="en">English</button>
      <button class="theme-btn" id="themeBtn" type="button" data-i18n="theme" data-i18n-aria="themeAria"></button>
    </div>
  </header>

  <section class="controls" data-i18n-aria="controlsAria">
    <div class="control">
      <span class="control-label" id="modeLabel" data-i18n="countBy"></span>
      <div class="seg" role="radiogroup" aria-labelledby="modeLabel" id="modeSeg">
        <button type="button" role="radio" data-mode="first" aria-checked="true" data-i18n="modeFirst"></button>
        <button type="button" role="radio" data-mode="paper" aria-checked="false" data-i18n="modePaper"></button>
        <button type="button" role="radio" data-mode="author" aria-checked="false" data-i18n="modeAuthor"></button>
      </div>
    </div>
    <div class="control">
      <label class="control-label" for="sessionSel" data-i18n="session"></label>
      <select id="sessionSel"></select>
    </div>
    <div class="control">
      <label class="control-label" for="typeSel" data-i18n="orgType"></label>
      <select id="typeSel"></select>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
  </section>
  <p class="mode-note" id="modeNote"></p>

  <section class="tiles" id="tiles" data-i18n-aria="overviewAria"></section>

  <div class="grid">
    <section class="card">
      <div class="card-head">
        <h2 data-i18n="byCountry"></h2>
        <p class="sub" id="countrySub"></p>
      </div>
      <div class="bars" id="countryChart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="collabTitle"></h2>
        <p class="sub" data-i18n="collabSub"></p>
      </div>
      <div id="collabChart"></div>
      <div class="card-head" style="margin-top:28px">
        <h2 data-i18n="intlTitle"></h2>
        <p class="sub" data-i18n="intlSub"></p>
      </div>
      <div id="intlChart"></div>
    </section>
  </div>

  <section class="card">
    <div class="card-head row">
      <div>
        <h2 data-i18n="byOrg"></h2>
        <p class="sub" id="orgSub"></p>
      </div>
      <div class="legend" id="orgLegend"></div>
    </div>
    <div class="bars" id="orgChart"></div>
    <button type="button" class="more-btn" id="orgMore"></button>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 data-i18n="heatTitle"></h2>
      <p class="sub" id="heatSub"></p>
    </div>
    <div class="heat-wrap" id="heatChart"></div>
  </section>

  <section class="card">
    <div class="card-head row">
      <div>
        <h2 data-i18n="authorTitle"></h2>
        <p class="sub" data-i18n="authorSub"></p>
      </div>
      <div class="seg small" role="radiogroup" data-i18n-aria="authorPosAria" id="authorSeg">
        <button type="button" role="radio" data-pos="first" aria-checked="true" data-i18n="posFirst"></button>
        <button type="button" role="radio" data-pos="last" aria-checked="false" data-i18n="posLast"></button>
        <button type="button" role="radio" data-pos="any" aria-checked="false" data-i18n="posAny"></button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data" id="authorTable"></table>
    </div>
  </section>

  <section class="card">
    <div class="card-head row">
      <div>
        <h2 data-i18n="paperTitle"></h2>
        <p class="sub" id="paperSub"></p>
      </div>
      <input type="search" id="paperSearch" data-i18n-ph="searchPh" data-i18n-aria="searchAria">
    </div>
    <div class="table-wrap">
      <table class="data papers" id="paperTable"></table>
    </div>
  </section>

  <footer class="foot">
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </footer>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script src="data/papers.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
